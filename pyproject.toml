[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pentest-scanner"
version = "1.0.0"
description = "Automated vulnerability scanner for bug bounty programs"
readme = "README.md"
license = {text = "MIT"}
authors = [
    {name = "mathiaswilliam761", email = "mathiaswilliam761@example.com"}
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Information Technology",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Security",
    "Topic :: Internet :: WWW/HTTP",
]
requires-python = ">=3.10"
dependencies = [
    "aiohttp>=3.9.0",
    "cryptography>=41.0.0",
    "lxml>=4.9.0",
    "requests>=2.31.0",
    "rich>=13.0.0",
    "urllib3>=2.0.0",
]
keywords = ["security", "pentesting", "bug-bounty", "vulnerability-scanner", "owasp"]

[project.optional-dependencies]
dev = [
    "pytest>=9.0.0",
    "pytest-asyncio>=1.4.0",
    "pytest-cov>=7.1.0",
]

[project.scripts]
pentest-scanner = "pentest_scanner.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["pentest_scanner*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]